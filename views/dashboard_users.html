<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard User</title>
<link rel="stylesheet" href="css/dashboard_profile_users.css">
</head>
<body>

<div class="header">
  <div class="logo-text">Kcoda logo</div>
</div>

<div class="dashboard-container">

  <!-- Left Agenda Panel -->  
  <div class="agenda-panel">
    <div class="icon-add">+</div>
    <div class="title">AGENDA</div>
    <div class="btn-group">
      <button class="btn">Barbershops</button>
      <button class="btn">Favorites</button>
      <div class="star-favorite">★</div>
    </div>

    <div class="barber-list">
      <div class="barber-item">
        <div>➚ BARBERSHOP NAME</div>
        <div class="icon-star">★</div>
      </div>
      <div class="barber-item">
        <div>➚  BARBERSHOP NAME 2</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBERSHOP NAME 3</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBERSHOP NAME 4</div>
      </div>
    </div>

    <div class="barber-detail">
      <div class="name-label">BARBERSHOP NAME</div>
      <div class="photo-box">
        <div class="icon-edit" style="position:absolute; bottom:4px; right:4px; font-size:18px; cursor:pointer;">↗</div>
      </div>
    </div>
  </div>

  <!-- Central Map -->
  <div class="map-panel">
    <div class="search-box">
      <span class="icon-search" aria-hidden="true">🔍</span>
      <input type="text" placeholder="Search..." />
    </div>

    <div class="map-image" aria-label="Simulated map">
      <!-- Trees -->
      <div class="tree tree1"></div>
      <div class="tree tree2"></div>
      <div class="tree tree3"></div>
      <div class="tree tree4"></div>
      <div class="tree tree5"></div>

      <!-- Location pin -->
      <div class="pin-location" title="Current location"></div>
    </div>
  </div>

  <!-- Right Panel: User -->
  <div class="user-panel">
    
    <div class="user-photo"><a href="/BarberIn/views/view_user_profile.html">Login </a></div>
    
    <div class="user-info-box"></div>
    <div class="user-info-box small"></div>
    <div class="user-info-box"></div>
    <div class="user-info-box large"></div>
  </div>

</div>

<div class="footer-barberin">
  BARBERIN
</div>

</body>
</html>
