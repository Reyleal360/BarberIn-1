<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard User</title>
<style>
  /* Reset básico */
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial Black', Arial, sans-serif;
    background: #fff;
    margin: 20px;
  }

  /* Contenedor principal */
  .dashboard-container {
    display: flex;
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ---------- Panel Izquierdo: Agenda --------- */
  .agenda-panel {
    border: 1px solid #aad1ff;
    border-radius: 8px;
    padding: 15px;
    width: 320px;
    background: #e0e2e7;
    box-shadow: 0 0 3px rgba(0, 0, 255, 0.2);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Icono + en círculo negro, top-left */
  .agenda-panel .icon-add {
    background: black;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }

  /* Título AGENDA */
  .agenda-panel .title {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 18px;
    margin-top: 5px;
    margin-bottom: 8px;
  }

  /* Botones barberos y favoritos */
  .btn-group {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .btn {
    background: #b2b2b2;
    color: #333;
    padding: 5px 15px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 12px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn.hover,
  .btn:focus,
  .btn:hover {
    background: #999;
  }

  /* Estrella al lado derecho (favoritos) */
  .star-favorite {
    background: #b2b2b2;
    width: 30px;
    height: 24px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
  }

  /* Lista de barberos */
  .barber-list {
    border: 2px solid #7f8ff4;
    border-radius: 6px;
    padding: 7px;
    background: #c3c3c3;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .barber-item {
    background: #a5a5a5;
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .barber-item .icon-star {
    font-weight: bold;
  }

  .barber-item .icon-arrows {
    font-size: 10px;
    margin-right: 8px;
    user-select: none;
  }

  /* Panel inferior con barber name + recuadro */
  .barber-detail {
    background: #a5a5a5;
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .barber-detail .name-label {
    background: #7f8ff4;
    border-radius: 10px;
    width: fit-content;
    padding: 5px 15px;
    margin: 0 auto;
    font-weight: bold;
    font-size: 12px;
    text-align: center;
  }

  .barber-detail .photo-box {
    background: #888888;
    border-radius: 8px;
    height: 100px;
    position: relative;
  }

  /* Icono pequeño en esquina inferior derecha */
  .barber-detail .photo-box .icon-edit {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 14px;
    cursor: pointer;
  }

  /* ---------- Panel Central: Mapa --------- */
  .map-panel {
    flex-grow: 1;
    position: relative;
    border: 3px solid #000;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    min-width: 400px;
  }

  /* Barra búsqueda */
  .search-box {
    display: flex;
    align-items: center;
    background: #ddd;
    border-radius: 15px;
    padding: 5px 10px;
    margin: 10px 15px 15px 15px;
  }

  .search-box input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    font-size: 14px;
    padding-left: 8px;
  }

  .search-box .icon-search {
    font-size: 18px;
    color: #999999;
  }

  /* Imagen del mapa - simulada con SVG simplificado */
  .map-image {
    position: relative;
    width: 100%;
    height: 280px;
    background: #ddd;
    background-image:
      linear-gradient(to right, transparent 33%, #aaa 33%, #aaa 34%, transparent 34%),
      linear-gradient(to right, transparent 66%, #aaa 66%, #aaa 67%, transparent 67%),
      linear-gradient(to bottom, transparent 33%, #aaa 33%, #aaa 34%, transparent 34%),
      linear-gradient(to bottom, transparent 66%, #aaa 66%, #aaa 67%, transparent 67%);
    background-size: 33.33% 100%, 33.33% 100%, 100% 33.33%, 100% 33.33%;
    background-position: top left, top right, top left, bottom left;
    background-repeat: no-repeat;
    border-radius: 0 0 8px 8px;
  }

  /* Puntos de árboles */
  .tree {
    width: 15px;
    height: 25px;
    background: #2f8f58;
    border-radius: 50% 50% 10% 10% / 100% 100% 20% 20%;
    position: absolute;
  }
  .tree::after {
    content: '';
    display: block;
    width: 3px;
    height: 10px;
    background: #3d372b;
    margin: 0 auto;
    border-radius: 0 0 50% 50%;
  }

  /* Posiciones aproximadas de árboles */
  .tree1 {top: 40px; left: 120px;}
  .tree2 {top: 130px; left: 230px;}
  .tree3 {top: 160px; left: 270px;}
  .tree4 {top: 90px; left: 300px;}
  .tree5 {top: 200px; left: 320px;}

  /* Marcador pin rojo */
  .pin-location {
    width: 22px;
    height: 30px;
    background: red;
    border-radius: 50% 50% 50% 50%;
    position: absolute;
    top: 180px;
    left: 230px;
  }
  .pin-location::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    top: 5px;
    left: 6px;
  }

  /* Panel derecho: Perfil usuario */
  .user-panel {
    width: 150px;
    border: 2px solid #f18282;
    border-radius: 8px;
    padding: 10px;
    background: #c1bdbd;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  /* Foto usuario */
  .user-photo {
    width: 84px;
    height: 84px;
    border-radius: 10px;
    background: #000;
    position: relative;
    border: 4px solid black;
  }

  /* Iconos usuario arriba */
  .user-icons {
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
  }
  .user-icons .icon-person {
    font-size: 18px;
    background: white;
    padding: 3px;
    border-radius: 40%;
    cursor: pointer;
    flex-shrink: 0;
  }
  .user-icons .icon-edit {
    font-size: 18px;
    cursor: pointer;
  }

  /* Caja gris arriba dentro user panel */
  .user-info-box {
    background: #aaa;
    width: 100%;
    height: 30px;
    border-radius: 8px;
  }
  .user-info-box.small {
    height: 20px;
  }

  /* Caja gris grande */
  .user-info-box.large {
    height: 70px;
  }

  /* ---------- Footer --------- */
  .footer-barberin {
    margin: 30px auto 0 auto;
    width: 100%;
    max-width: 1000px;
    background: #ccc;
    border-radius: 6px;
    padding: 15px;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 20px;
    text-align: center;
    letter-spacing: 3px;
  }

</style>
</head>
<body>

<h2>Dashboard User</h2>

<div class="dashboard-container">

  <!-- Agenda Panel Izquierdo -->  
  <div class="agenda-panel">
    <div class="icon-add">+</div>
    <div class="title">AGENDA</div>
    <div class="btn-group">
      <button class="btn">Barberías</button>
      <button class="btn">Favorites</button>
      <div class="star-favorite">★</div>
    </div>

    <div class="barber-list">
      <div class="barber-item">
        <div>➚ BARBER NAME</div>
        <div class="icon-star">★</div>
      </div>
      <div class="barber-item">
        <div>BARBER NAME 2</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBER NAME 3</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBER NAME 4</div>
      </div>
    </div>

    <div class="barber-detail">
      <div class="name-label">BARBER NAME</div>
      <div class="photo-box">
        <div class="icon-edit" style="position:absolute; bottom:4px; right:4px; font-size:18px; cursor:pointer;">↗</div>
      </div>
    </div>
  </div>

  <!-- Mapa Central -->
  <div class="map-panel">
    <div class="search-box">
      <span class="icon-search" aria-hidden="true">🔍</span>
      <input type="text" placeholder="Buscar..." />
    </div>

    <div class="map-image" aria-label="Mapa simulado">
      <!-- Arboles -->
      <div class="tree tree1"></div>
      <div class="tree tree2"></div>
      <div class="tree tree3"></div>
      <div class="tree tree4"></div>
      <div class="tree tree5"></div>

      <!-- Pin de ubicación -->
      <div class="pin-location" title="Ubicación actual"></div>
    </div>
  </div>

  <!-- Panel Derecho: Usuario -->
  <div class="user-panel">
    <div class="user-icons">
      <span class="icon-person" title="Usuario">👤</span>
      <span class="icon-edit" title="Editar perfil">✏️</span>
    </div>

    <div class="user-photo"></div>

    <div class="user-info-box"></div>
    <div class="user-info-box small"></div>
    <div class="user-info-box"></div>
    <div class="user-info-box large"></div>
  </div>

</div>

<div class="footer-barberin">
  BARBERIN
</div>

</body>
</html>
