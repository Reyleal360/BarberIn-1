<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard User</title>
<link rel="stylesheet" href="css/dashboard_profile_users.css">
</head>
<body>

<div class="header">
  <h2>Dashboard User</h2>
</div>

<div class="dashboard-container">

  <!-- Agenda Panel Izquierdo -->  
  <div class="agenda-panel">
    <div class="icon-add">+</div>
    <div class="title">AGENDA</div>
    <div class="btn-group">
      <button class="btn">Barberías</button>
      <button class="btn">Favorites</button>
      <div class="star-favorite">★</div>
    </div>

    <div class="barber-list">
      <div class="barber-item">
        <div>➚ BARBER NAME</div>
        <div class="icon-star">★</div>
      </div>
      <div class="barber-item">
        <div>BARBER NAME 2</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBER NAME 3</div>
      </div>
      <div class="barber-item">
        <div>➚ BARBER NAME 4</div>
      </div>
    </div>

    <div class="barber-detail">
      <div class="name-label">BARBER NAME</div>
      <div class="photo-box">
        <div class="icon-edit" style="position:absolute; bottom:4px; right:4px; font-size:18px; cursor:pointer;">↗</div>
      </div>
    </div>
  </div>

  <!-- Mapa Central -->
  <div class="map-panel">
    <div class="search-box">
      <span class="icon-search" aria-hidden="true">🔍</span>
      <input type="text" placeholder="Buscar..." />
    </div>

    <div class="map-image" aria-label="Mapa simulado">
      <!-- Arboles -->
      <div class="tree tree1"></div>
      <div class="tree tree2"></div>
      <div class="tree tree3"></div>
      <div class="tree tree4"></div>
      <div class="tree tree5"></div>

      <!-- Pin de ubicación -->
      <div class="pin-location" title="Ubicación actual"></div>
    </div>
  </div>

  <!-- Panel Derecho: Usuario -->
  <div class="user-panel">
    <div class="user-icons">
      <span class="icon-person" title="Usuario">👤</span>
      <span class="icon-edit" title="Editar perfil">✏️</span>
    </div>

    <div class="user-photo"></div>

    <div class="user-info-box"></div>
    <div class="user-info-box small"></div>
    <div class="user-info-box"></div>
    <div class="user-info-box large"></div>
  </div>

</div>

<div class="footer-barberin">
  BARBERIN
</div>

</body>
</html>
